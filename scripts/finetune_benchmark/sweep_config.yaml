# Fine-tuning data-volume benchmark: TranslateGemma vs NLLB-200.
#
# Every path, volume, model and metric decision lives here. Nothing in this
# directory reads config.yaml / benchmark_config.yaml directly; those two files
# are used only as BASE templates that the overrides below are merged over, so
# the repository's validated training and scoring defaults are inherited without
# being modified.
#
#   docker compose run --rm trainer \
#     python scripts/finetune_benchmark/run_sweep.py all \
#       --config scripts/finetune_benchmark/sweep_config.yaml
sweep:
  output_dir: "logs/finetune_benchmark"
  # Artefacts land in <output_dir>/<run_id>. Left unset, run_id names the budget
  # below (fixed_epochs_e1, fixed_steps_auto, ...), so running both budget modes
  # cannot overwrite or silently reuse each other's cells. The data stage is
  # shared: both modes train on the same subsets, which is the point.
  run_id: null
  # Physical GPU IDs the sweep may use. One job per GPU, scheduled as a pool:
  # 8 fine-tunes and every evaluation shard run 4-wide on this host.
  gpus: [4, 5, 6, 7]
  # Fine-tune data volumes, in rows. Subsets are nested (5k is a subset of 10k
  # and so on), so a volume-to-volume delta is data ADDED, not data swapped.
  volumes: [5000, 10000, 50000, 100000]
  # How much training each cell gets, and therefore what a volume-to-volume
  # delta means.
  #
  #   fixed_epochs  every cell sees its data `epochs` times, so a larger volume
  #                 also gets proportionally more optimizer steps. Reads as
  #                 "what does more data buy"; mixes volume with compute, and
  #                 the report prices each cell in GPU-hours so that is visible.
  #   fixed_steps   every cell gets the same number of optimizer steps, so the
  #                 small cells repeat their data and the large ones see part of
  #                 theirs once. Isolates data diversity at equal compute, and
  #                 will overfit the small cells — that is the finding, not a bug.
  #
  # Run both to separate the two effects: the same data stage feeds them, and
  # each mode writes to its own output_dir.
  budget:
    mode: "fixed_epochs"
    epochs: 1
    # fixed_steps only. "auto" derives the cap from the smallest volume at
    # `epochs` epochs, so every cell gets the compute the smallest cell would
    # have had. An integer applies to both arms; a mapping sets each arm
    # separately, e.g. { translategemma: 120, nllb: 700 }. Prefer explicit
    # values for the TranslateGemma arm: packing turns rows into fewer, longer
    # blocks, so a row-derived estimate covers more epochs than it looks like.
    max_steps: "auto"
    # In fixed_steps mode, eval/checkpoint intervals are derived as
    # max_steps / evals_per_run, because an epoch boundary may never be reached.
    evals_per_run: 4
  seed: 42
  # Keep the matrix running when one cell fails (an OOM, a bad path) and mark it
  # failed in the report instead of losing the completed cells.
  fail_fast: false
  # Verify staged checkpoints, test sets, GPU ids and disk before the finetune
  # and evaluate stages queue anything. Local and cheap; a corrupt shard costs
  # seconds to find here and a queue of half-run cells to find later.
  preflight: true
  telemetry:
    enabled: true
    interval_seconds: 2.0

# The domain corpus every training subset and the in-domain test set come from.
corpus:
  csv_path: "data/domain_corpus.csv"
  columns:
    id: "id"
    source: "en"
    target: "fa"
    domain: "domain"
  # Document id is the part of `id` before this separator. Subsets and the test
  # set are split on documents, never rows, or adjacent chunks leak.
  id_separator: ":"
  source_lang: "en"
  target_lang: "fa"

data:
  work_dir: "data/finetune_benchmark"
  # 500 rows reserved with build_test_set.py's strategy: stratified by
  # domain x length, diversity-maximised, then document-level held out from the
  # training pool with a near-duplicate purge.
  in_domain_test:
    mode: "build" # "build" runs build_test_set.py; "existing" uses existing_path.
    existing_path: null
    size: 500
    # Domains withheld from the test set, and therefore fully available for
    # training. Use this for a domain small enough that the document-level
    # holdout would consume all of it: its rows would otherwise be unavailable
    # both for training and for any meaningful in-domain measurement. Its
    # quality is then read from NTREX/FLORES instead.
    # "general" is withheld: it is small enough that the document-level holdout
    # consumed every one of its documents, leaving it untrainable. Its rows are
    # appended back to the train pool, and its quality is read from NTREX/FLORES
    # rather than from in-domain rows of its own.
    exclude_domains: ["general"]
    # Merged over testset_config.yaml. selection.total_size and the dev split
    # are forced by the sweep (500 rows, test only), so do not set them here.
    overrides:
      selection:
        seed: 42
        max_test_documents: 40
      dedup:
        enabled: true
        minhash_enabled: true
        embedding_dedup_enabled: true
      splits:
        dev_test_split: false
      gold_subset:
        enabled: false
  # Held out from each training subset for the trainer's eval_loss. No test
  # split is produced here: the test sets are the three files below.
  validation_ratio: 0.05

  # Domain composition of every training subset.
  #
  #   pool_proportional  mirror the train pool's own domain shares (default)
  #   random             ignore domains; one random document order
  #   domain_shares      hit the explicit target shares below
  #
  # Subsets stay nested (5k subset of 10k subset of ...) in all three modes,
  # because each domain keeps one fixed document order and a larger volume just
  # takes a longer prefix of it. Setting per_volume breaks that guarantee, and
  # the data stage says so in the log when it does.
  composition:
    mode: "pool_proportional"
    # What a quota is filled from.
    #
    #   row       shuffle the domain's rows and take a prefix (default). The
    #             composition is exact and a subset is as document-diverse as
    #             the pool allows — the right choice when the corpus has few,
    #             very large documents, where whole-document draws would make a
    #             small subset come from a handful of them.
    #   document  shuffle documents and take them whole, so a subset's rows stay
    #             contiguous inside their source documents.
    #
    # Either way the test set's documents are already out of the pool, so this
    # is a diversity choice, not a contamination one.
    unit: "row"
    # Used by mode: domain_shares. Labels must match the corpus domain column
    # exactly; shares must sum to 1.
    domain_shares:
      # Computer: 0.80
      # Mathematics: 0.15
      # General: 0.05
    # Optional per-volume override, keyed by row count.
    per_volume:
      # 5000: { Computer: 0.90, Mathematics: 0.10 }
    # A domain that cannot fill its quota is either an error (default) or its
    # deficit is spread over the domains that still have documents left.
    on_shortfall: "error" # error | redistribute

models:
  translategemma:
    enabled: true
    label: "TranslateGemma 12B"
    kind: "causal_lora" # Fine-tuned by the repository's train.py, unmodified.
    family: "translategemma"
    size: "12b"
    base_model_id: "google/translategemma-12b-it"
    # Merged over config.yaml. Data paths, output dirs, epochs and the
    # evaluation-after-training switch are set per cell by the sweep.
    overrides:
      model:
        attn_implementation: "flash_attention_3"
      training:
        batch_size: 6
        eval_batch_size: 2
        effective_batch_size: 48
        learning_rate: 2.0e-4
        packing: true
        gradient_checkpointing: true
        use_liger_kernel: true
        save_total_limit: 1
        # Per epoch, not per N steps. A 5k cell is only tens of optimizer steps
        # long, so a step interval tuned for the full corpus would never fire:
        # no eval, no checkpoint, and load_best_model_at_end with nothing to
        # load. Epoch boundaries also make eval_loss comparable across volumes.
        evaluation_strategy: "epoch"
        save_strategy: "epoch"
        report_to: "none"
    evaluation:
      runner: "translategemma"
      source_lang: "en"
      target_lang: "fa"
      dtype: "bfloat16"
      attn_implementation: "sdpa"

  nllb:
    enabled: true
    label: "NLLB-200 3.3B"
    kind: "seq2seq_lora" # Fine-tuned by train_nllb_lora.py in this directory.
    family: "nllb"
    size: "3.3b"
    base_model_id: "facebook/nllb-200-3.3B"
    # NLLB language tags are model-specific, not ISO-639-1.
    source_lang_token: "eng_Latn"
    target_lang_token: "pes_Arab"
    training:
      learning_rate: 1.0e-4
      per_device_batch_size: 8
      gradient_accumulation_steps: 6 # Effective batch 48, matching the Gemma side.
      # The corpus averages 336 tokens with p95 at 1072
      # (docs/2026-08-03_training_speed_tier1_tier2_applied.md), so 512 truncates
      # a long tail. NLLB's encoder caps at 1024 positions; raise these towards
      # it if the OOM headroom allows, and lower per_device_batch_size to match.
      max_source_length: 512
      max_target_length: 512
      warmup_ratio: 0.03
      lr_scheduler_type: "cosine"
      weight_decay: 0.0
      max_grad_norm: 1.0
      label_smoothing_factor: 0.0
      logging_steps: 25
      # Epoch boundaries, for the same reason as the Gemma arm above.
      eval_strategy: "epoch"
      save_strategy: "epoch"
      save_total_limit: 1
      bf16: true
      gradient_checkpointing: true
      dataloader_num_workers: 2
      optim: "adamw_torch_fused"
      lora:
        r: 16
        alpha: 32
        dropout: 0.05
        # Encoder/decoder attention and FFN projections. NLLB names its FFN
        # layers fc1/fc2, not gate/up/down.
        target_modules: ["q_proj", "k_proj", "v_proj", "out_proj", "fc1", "fc2"]
    evaluation:
      runner: "nllb"
      source_lang: "eng_Latn"
      target_lang: "pes_Arab"
      dtype: "bfloat16"

# Every system is evaluated on every enabled test set. `path: auto` on the
# in-domain set resolves to the 500 rows produced by the data stage.
test_sets:
  - id: "in_domain"
    label: "In-domain (500, held out)"
    enabled: true
    path: "auto"
    columns: { id: "id", source: "en", reference: "fa", domain: "domain" }
  - id: "ntrex"
    label: "NTREX-128 en→fa"
    enabled: true
    path: "data/testsets/ntrex_en_fa.csv"
    columns: { id: "id", source: "en", reference: "fa", domain: "domain" }
    # Public sets carry no domain column; a constant keeps the slice tables valid.
    default_domain: "ntrex"
  - id: "flores"
    label: "FLORES-200 devtest en→fa"
    enabled: true
    path: "data/testsets/flores200_devtest_en_fa.csv"
    columns: { id: "id", source: "en", reference: "fa", domain: "domain" }
    default_domain: "flores"

evaluation:
  # One candidate per GPU. Generation is scheduled across sweep.gpus; scoring
  # and report rendering are single-process stages by design.
  generation:
    batch_size: 8
    max_new_tokens: 512
    num_beams: 1
    do_sample: false
    # Applies to the NLLB runner only (the TranslateGemma runner does not
    # truncate its prompts). 1024 is NLLB's encoder position limit, so this is
    # the most source it can see; the hit_max_new_tokens metric shows whether
    # the output side was the binding constraint instead.
    max_source_tokens: 1024
  # Optional overrides. Per test set they go into the shared generation profile,
  # so changing one test set does not invalidate outputs already collected for
  # the others. Per model arm (models.<key>.evaluation.generation) they land in
  # the candidate itself, whose hash decides output reuse — setting one there
  # forces that candidate to regenerate.
  #
  # Sensible starting points on a 140 GiB H200, where batch 8 peaked at ~33 GiB:
  #   TranslateGemma 12B  batch_size 32   (~24 GiB weights + ~0.6 GiB KV/sequence)
  #   NLLB-200 3.3B       batch_size 96   (~7 GiB weights, small KV)
  # Short single-sentence sets (FLORES, NTREX) also do not need 512 new tokens;
  # check hit_max_new_tokens in the report before lowering it.
  # Merged over benchmark_config.yaml's metrics/statistics/report sections, so
  # a number here is comparable with a number from a plain benchmark run.
  overrides:
    metrics:
      transparent:
        enabled: true
        chrf_word_order: 2
      comet:
        enabled: true
        model: "Unbabel/XCOMET-XL"
        batch_size: 8
        gpus: 1
      metricx:
        enabled: true
        model: "google/metricx-24-hybrid-xl-v2p6-bfloat16"
        tokenizer: "google/mt5-xl"
        max_length: 1536
        # Read only by this directory's scorer. The benchmark's own
        # implementation scores one row per forward pass, which
        # docs/EVALUATION_RUNBOOK.md lists as a known gap; score.py batches
        # (identical scores, far fewer forwards). 16 is comfortable for the XL
        # checkpoint on an H200; 1 reproduces the row-at-a-time behaviour.
        batch_size: 16
    statistics:
      bootstrap_samples: 2000
      seed: 42
    report:
      slices: ["domain"]

report:
  # Headline metric for rankings, the conclusion, and the cost-per-point table.
  primary_metric: "comet"
  # Shown in the cross-test-set tables, in this order. Unavailable metrics are
  # dropped rather than erroring.
  metrics: ["comet", "metricx", "sentence_chrf", "sentence_bleu", "empty_output", "source_copy"]
  filename: "finetune_benchmark_report.html"
  # Decoding-failure rate above which a system is called out in the report.
  # translation_benchmark scores corpus averages, which cannot express "this
  # system stopped translating and filled the token budget"; the audit from
  # degeneration.py can, and the 2026-08-10 adapter is why it exists. null
  # disables the check. Reported, never fatal: the generation has already run.
  max_degeneration_rate: 0.15
  # Blinded side-by-side export for human judgement: randomized per-row system
  # labels, no scores, empty adequacy/fluency/terminology columns to fill in.
  # The key that unblinds it is written beside it.
  human_review:
    enabled: true
    rows_per_test_set: 40
    seed: 42
    # Narrow the export to the comparison actually in dispute. Ten systems x 40
    # rows x 3 test sets is 1,200 blinded rows, which nobody reads; two systems
    # on one test set is 80. Empty means every system and every test set.
    #   systems: ["translategemma-base", "translategemma-100k"]
    #   test_sets: ["flores"]
    systems: []
    test_sets: []
  # Energy is estimated from sampled power draw; on a shared host the power a
  # concurrent job draws is not attributed away from this one.
  electricity_price_per_kwh: null

logging:
  logs_dir: "logs"
  level: "INFO"
  file_level: "DEBUG"
