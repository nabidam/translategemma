# Every path and training/evaluation decision is configured here. Keep this file with
# the output adapters so a run can be reproduced.
model:
  base_model_id: "google/translategemma-12b-it"
  output_dir: "./translategemma-farsi-science"
  sft_checkpoint_subdir: "sft"
  sft_final_subdir: "sft_final"
  dpo_checkpoint_subdir: "dpo"
  dpo_final_subdir: "dpo_final"
  run_metadata_filename: "run_metadata.json"
  # Device placement comes from each Accelerate process's local device. Do not
  # add a fixed device_map here: under DDP that would place every rank on GPU 0.
  # Dtype of every parameter that is NOT 4-bit quantised: embeddings, norms and
  # the 262k-row lm_head. Left unset, transformers loads them in float32.
  dtype: "bfloat16"
  # "sdpa" is the safe default and already dispatches to fused kernels on
  # Hopper. Set "flash_attention_3" after installing the `speed` extra
  # (see pyproject.toml). FA3 requires compute capability >= 9.0 and CUDA
  # >= 12.3; CUDA 12.8 is recommended.
  attn_implementation: "flash_attention_3"
  # QLoRA. On an H100 the 4-bit weights save VRAM you do not need and add a
  # dequantisation step to every matmul, so bf16 LoRA is usually faster.
  # Benchmark both; see docs/2026-08-03_training_speed_tier1_tier2_applied.md.
  use_4bit: false
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

data:
  train_sft_dataset_path: "data/splits/train.jsonl"
  validation_sft_dataset_path: "data/splits/validation.jsonl" # Set null for train-only runs.
  test_dataset_path: "data/splits/test.jsonl" # Set null and disable run_after_training when no test split exists.
  dpo_train_dataset_path: "data/dpo_train_farsi_science.jsonl"
  source_lang: "en"
  target_lang: "fa"
  # Optional per-row overrides. A row may set these fields to train/evaluate a
  # different direction; absent fields fall back to source_lang/target_lang.
  source_lang_column: "src_lang"
  target_lang_column: "tgt_lang"
  source_column: "source_text"
  target_column: "target_text"
  # Optional DPO response column names; defaults remain compatible with old data.
  dpo_chosen_column: "farsi_chosen"
  dpo_rejected_column: "farsi_rejected"
  id_column: "id"
  domain_column: "domain"
  # Rank zero writes immutable tokenized/packed datasets here; other ranks wait
  # and load the same cache instead of starting their own process pools.
  prepared_cache_dir: "./data/prepared_cache"

# Used only by split_dataset.py, never by train.py. Splitting by the document part of
# id (for example, "42" in "42:17") prevents adjacent segments leaking across splits.
splitting:
  input_dataset_path: "data/sft_farsi_science.jsonl"
  output_dir: "data/splits"
  train_filename: "train.jsonl"
  validation_filename: "validation.jsonl"
  test_filename: "test.jsonl"
  group_id_delimiter: ":"
  train_ratio: 0.90
  validation_ratio: 0.05 # May be 0; no validation file is written.
  test_ratio: 0.05 # May be 0; no test file is written. If both are 0, input is copied to train.
  seed: 42
  deduplicate_by_source: true
  stratify_by_domain: true
  manifest_filename: "split_manifest.json"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # TranslateGemma is multimodal, but this pipeline supplies text-only batches.
  # PEFT matches target_modules by suffix, so q/k/v projections would otherwise
  # also add unused adapters inside the vision tower. Transformers names the
  # Gemma 3 module `vision_tower`; see:
  # https://github.com/huggingface/transformers/blob/main/src/transformers/models/gemma3/modular_gemma3.py
  exclude_modules: ".*vision_tower.*"
  target_modules:
    [
      "q_proj",
      "k_proj",
      "v_proj",
      "o_proj",
      "gate_proj",
      "up_proj",
      "down_proj",
    ]

training:
  run_sft: true
  run_dpo: false
  seed: 42
  # Per-device micro-batch (packed blocks when packing is enabled).
  # effective_batch_size derives accumulation from the active world size:
  # 8/4/2/1 for 1/2/4/8 GPUs.
  batch_size: 6
  eval_batch_size: 2
  # Deterministic validation subset used during training. null uses the full
  # validation file; the subset is sampled with training.seed before tokenizing.
  validation_max_examples: 10000
  effective_batch_size: 48
  # Used only when effective_batch_size is null.
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  dpo_learning_rate: 5.0e-6
  dpo_epochs: 1
  dpo_beta: 0.1
  epochs: 3
  bf16: true
  # Run scripts/analyze_token_lengths.py before changing this. This is both the
  # truncation cap and the target BFD packed-block length.
  max_length: 2048
  truncation_side: "right"
  # Truncation removes the tail, and the tail holds <end_of_turn>, so a
  # truncated example is a completion the model is never taught to finish. The
  # 2026-08-09 run trained on 105,567 of them (3.86%). Set false to keep them;
  # they will end mid-sentence with no terminator.
  drop_overlength_examples: true
  # Touch this file (default <model.output_dir>/STOP) to end a run cleanly at
  # the next checked step: it evaluates, saves, then runs Trainer's normal
  # end-of-training path, so load_best_model_at_end fires and sft_final is
  # written. Killing the process instead loses everything since the last save.
  stop_file: null
  stop_file_check_steps: 10
  # Alignment for unpacked batches (including the validation split). Packed
  # padding-free training blocks do not add alignment padding.
  pad_to_multiple_of: 8
  # Disabled deliberately: constructing the grouped sampler caused a long,
  # apparently frozen startup on the production corpus. Packing removes most
  # padding without that per-run sampler construction.
  group_by_length: false
  length_column_name: "length"
  # SFT train-only BFD packing. Rank zero builds and caches packed blocks once.
  # This requires FlashAttention 3 so reset position_ids enforce document
  # boundaries; validation stays unpacked for directly interpretable loss.
  packing: true
  packing_strategy: "bfd"
  gradient_checkpointing: true
  # Non-reentrant checkpointing is the supported path for LoRA: the reentrant
  # implementation drops the graph for inputs that do not require grad.
  gradient_checkpointing_kwargs: { "use_reentrant": false }
  # Fuses cross-entropy with the lm_head projection, so the
  # batch x seq x 262144 logit tensor is never materialised. This is the single
  # largest memory and time cost of training Gemma 3, ahead of attention.
  use_liger_kernel: true
  max_grad_norm: 1.0
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  logging_steps: 10
  evaluation_strategy: "steps"
  # Used when evaluation_strategy is "steps". Integers count optimizer update
  # steps (after gradient accumulation), not individual micro-batches.
  eval_steps: 500
  save_strategy: "steps"
  # Used when save_strategy is "steps". When load_best_model_at_end is true,
  # save_steps must be a multiple of eval_steps.
  save_steps: 500
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  # null starts a new run; true resumes the newest checkpoint in the enabled
  # stage's checkpoint directory; a string selects an explicit checkpoint-*.
  # Resume only one of SFT/DPO at a time when using an explicit path.
  resume_from_checkpoint: null
  dataloader_num_workers: 2
  dataloader_pin_memory: true
  # Keeps the worker processes (and their prefetch queues) alive between epochs
  # and between evaluation passes. Ignored when dataloader_num_workers is 0.
  dataloader_persistent_workers: true
  # Processes used to tokenize the dataset once, before training starts. Clamped
  # to the split size, so small dry runs stay single-process. Set null or 1 to
  # disable multiprocessing.
  tokenize_num_proc: 16
  # LoRA trains ~0.5% of the parameters, so the optimizer state is small and
  # paging it through host memory only adds synchronisation stalls.
  optimizer: "adamw_torch_fused"
  report_to: "none"

# Used only by scripts/analyze_token_lengths.py. It renders the same chat
# template train.py uses, so the reported lengths are the lengths that will be
# trained on, not a raw character-count proxy.
length_analysis:
  dataset_path: null # null means training.train_sft_dataset_path.
  percentiles: [50, 75, 90, 95, 99, 99.9]
  max_examples: null # Sample this many rows instead of the full split.
  candidate_max_lengths: [512, 1024, 1536, 2048]
  report_path: "logs/token_length_report.json"

evaluation:
  run_after_training: true
  run_baseline: true
  adapter_path: null # Set only when evaluating an existing adapter directly.
  output_dir: "evaluation"
  adapter_prefix: "adapter"
  baseline_prefix: "base"
  detailed_filename: "detailed_scores.csv"
  summary_filename: "summary.json"
  human_review_filename: "human_review_sample.csv"
  human_review_seed: 42
  eval_batch_size: 8 # GPU batch size for batched evaluation generation
  max_new_tokens: 1024
  do_sample: false
  temperature: 1.0
  top_p: 1.0
  num_beams: 1
  # Model-free metrics computed with translation_benchmark/metrics.py, so a
  # number here is directly comparable with the same number in a benchmark run.
  # They cost only CPU time and run on the main process before the scoring
  # models load. Drop entries from `metrics` to shorten the summary table.
  transparent_metrics_enabled: true
  transparent_metrics:
    chrf_word_order: 2 # chrF++
    metrics:
      - "sentence_bleu"
      - "sentence_chrf"
      - "number_preservation" # Preservation metrics are NaN, and excluded from
      - "acronym_preservation" # the mean, on rows whose source has no such item.
      - "formula_preservation"
      - "empty_output"
      - "source_copy"
  metricx_enabled: true
  metricx_model_id: "google/metricx-24-hybrid-large-v2p6"
  # MetricX repositories contain no tokenizer files. MetricX-24 was initialised
  # from mT5 and predict.py always tokenizes with google/mt5-xl.
  metricx_tokenizer_id: "google/mt5-xl"
  # MetricX-24 was trained at 1536 tokens (MetricX-23 used 1024). Raising this
  # further produces unpredictable scores.
  metricx_max_length: 1536
  comet_enabled: true
  # XCOMET-XL (3.5B) is reference-based and gated on the Hub: accept the licence
  # once with the account whose token is on the host. XCOMET-XXL is 10.7B and
  # needs ~24 GB more VRAM. Use Unbabel/wmt22-cometkiwi-da or XCOMET-XL-QE with
  # comet_reference_free: true when no reference is available.
  comet_model_id: "Unbabel/XCOMET-XL"
  comet_reference_free: false
  # XCOMET is far larger than wmt22-comet-da; lower this first on an OOM.
  comet_batch_size: 8
  # GPUs per rank, not in total. COMET is sharded across ranks the same way
  # MetricX and generation are, each rank scoring its own slice on its own
  # device, so this stays 1 under any accelerate profile.
  comet_gpus: 1
  human_review_samples_per_domain: 15
  # Classify decoding failures (unstopped output, loops, leaked boilerplate)
  # before the scoring models load. MetricX and COMET are corpus averages and
  # cannot express "this system stopped translating and filled the token
  # budget"; see docs/2026-08-10_adapter_degeneration_analysis.md.
  degeneration_audit_enabled: true
  # Fail the run when a system's failure rate exceeds this. The base model sits
  # near 0.08 on this test set because some source segments legitimately repeat,
  # so a threshold below that would fail every run. null reports without failing.
  max_degeneration_rate: 0.15

logging:
  logs_dir: "logs"
  level: "INFO"
  file_level: "DEBUG"

# A real, isolated training run for validating the current model/data/trainer
# stack before spending time on the full corpus. The same enabled stages and
# training settings are used; only the dataset size and output locations differ.
# Pass --canary to train.py to activate this section.
canary:
  max_examples: 32
  max_steps: null # null uses the configured epoch count; set a positive integer to cap updates.
  output_dir: "./translategemma-farsi-science-canary"
  run_after_training: false
  evaluation_output_dir: "./evaluation-canary"
  resume_from_checkpoint: null

# Runs the real SFT model/data/collator/Trainer path for the selected model-size
# profiles and benchmark dimensions. Defaults follow the H200F size table in
# docs/refs/multi_gpu_h200f.md. Profile values are recursively merged over the
# built-in 4b/12b/27b definitions, so only deviations need to be listed here.
benchmark:
  types: [gpu_count, batch_size, training_options]
  model_sizes: [4b, 12b, 27b]
  model_profiles:
    4b:
      model:
        base_model_id: "google/translategemma-4b-it"
      per_device_batch_size: 12
      effective_batch_size: 96
      batch_sizes: [3, 6, 12]
    12b:
      model:
        base_model_id: "google/translategemma-12b-it"
      per_device_batch_size: 6
      effective_batch_size: 48
      batch_sizes: [2, 3, 6]
    27b:
      model:
        base_model_id: "google/translategemma-27b-it"
      per_device_batch_size: 2
      effective_batch_size: 16
      batch_sizes: [1, 2]

  # GPU scaling varies world size and derives accumulation while preserving the
  # selected model profile's effective global batch.
  gpu_counts: [1, 2, 4, 8]

  # The other two dimensions use a fixed GPU count so only the setting under
  # study changes. Every batch_sizes entry must divide effective_batch_size
  # after multiplication by batch_gpu_count.
  batch_gpu_count: 1
  training_options_gpu_count: 1
  training_option_profiles:
    - { name: checkpointing_packing, gradient_checkpointing: true, packing: true }
    - { name: checkpointing_only, gradient_checkpointing: true, packing: false }
    - { name: packing_only, gradient_checkpointing: false, packing: true }
    - { name: neither, gradient_checkpointing: false, packing: false }

  # The placeholder is replaced for every matrix entry and validated against
  # the profile's num_processes before any training process starts.
  accelerate_config_pattern: "accelerate_configs/h200_{gpu_count}gpu.yaml"
  max_examples: 20000
  max_steps: 200
  # Discarded 1-GPU optimizer steps per model size populate its shape-specific
  # Triton/FA3 JIT caches before timing that model's matrix.
  warmup_steps: 5
  run_evaluation: true
  # Sample device-level VRAM, utilization, power, temperature, and clocks with
  # nvidia-smi during every measured job. Raw samples stay beside result.json.
  collect_gpu_telemetry: true
  telemetry_interval_seconds: 1.0
  # Keep the matrix running after a worker failure (for example, an expected
  # out-of-memory result with checkpointing disabled) and include it in reports.
  fail_fast: false
  output_dir: "logs/training_benchmark"
  report_filename: "benchmark_results.json"
  # null preserves the process's CUDA_VISIBLE_DEVICES. Alternatively list the
  # physical GPU IDs all benchmark jobs may use, for example [0, 1, 2, 3].
  devices: null

# Fast, config-driven search for the validation per-device batch size. The helper
# script performs one tiny SFT step, then evaluates the same trained model with
# each candidate. It never loads or evaluates the held-out test split.
eval_batch_search:
  train_max_examples: 1
  validation_max_examples: null # null evaluates the complete configured validation split.
  max_steps: 1
  eval_batch_sizes: [2, 4, 6, 8, 12]
  output_dir: "logs/eval_batch_search"
