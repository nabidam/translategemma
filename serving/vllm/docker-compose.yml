services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.13.0}
    container_name: translategemma-vllm
    restart: unless-stopped
    ipc: host
    environment:
      - VLLM_OFFLINE=1
      - HF_HUB_OFFLINE=1
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
    volumes:
      - ${MODEL_DIR:-/opt/models/translategemma/current}:/models/model:ro
    ports:
      # Expose only to internal network / localhost, not to public internet
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    command:
      - "--model"
      - "/models/model"
      - "--served-model-name"
      - "${SERVED_MODEL_NAME:-translategemma}"
      - "--dtype"
      - "bfloat16"
      - "--tensor-parallel-size"
      - "${TENSOR_PARALLEL_SIZE:-1}"
      - "--max-model-len"
      - "${MAX_MODEL_LEN:-4096}"
      - "--max-num-seqs"
      - "${MAX_NUM_SEQS:-128}"
      - "--max-num-batched-tokens"
      - "${MAX_NUM_BATCHED_TOKENS:-8192}"
      - "--gpu-memory-utilization"
      - "${GPU_MEMORY_UTILIZATION:-0.90}"
      - "--enforce-eager"
      - "--disable-log-requests"
      - "--port"
      - "8000"
      - "--host"
      - "0.0.0.0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
