services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.13.0}
    container_name: translategemma-vllm
    restart: unless-stopped
    ipc: host
    environment:
      - VLLM_OFFLINE=1
      - HF_HUB_OFFLINE=1
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
    volumes:
      - ${MODEL_DIR:-/opt/models/translategemma/current}:/models/model:ro
    # Expose only to internal network, not to host public interface
    expose:
      - "8000"
    command:
      - "--model"
      - "/models/model"
      - "--served-model-name"
      - "${SERVED_MODEL_NAME:-translategemma}"
      - "--dtype"
      - "bfloat16"
      - "--tensor-parallel-size"
      - "${TENSOR_PARALLEL_SIZE:-1}"
      - "--max-model-len"
      - "${MAX_MODEL_LEN:-4096}"
      - "--max-num-seqs"
      - "${MAX_NUM_SEQS:-128}"
      - "--max-num-batched-tokens"
      - "${MAX_NUM_BATCHED_TOKENS:-8192}"
      - "--gpu-memory-utilization"
      - "${GPU_MEMORY_UTILIZATION:-0.90}"
      - "--enforce-eager"
      - "--disable-log-requests"
      - "--port"
      - "8000"
      - "--host"
      - "0.0.0.0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request, sys; r = urllib.request.urlopen('http://localhost:8000/health'); sys.exit(0 if r.status == 200 else 1)\" || curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - serving_net

  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    container_name: translategemma-gateway
    restart: unless-stopped
    depends_on:
      vllm:
        condition: service_healthy
    volumes:
      # Mount model artifact read-only for exact tokenizer and processor loading
      - ${MODEL_DIR:-/opt/models/translategemma/current}:/models/model:ro
    environment:
      - TG_VLLM_BASE_URL=http://vllm:8000/v1
      - TG_VLLM_MODEL_NAME=${SERVED_MODEL_NAME:-translategemma}
      - TG_VLLM_MAX_MODEL_LEN=${MAX_MODEL_LEN:-4096}
      - TG_MAX_TOTAL_CONTEXT_TOKENS=${MAX_MODEL_LEN:-4096}
      - TG_MODEL_DIR=/models/model
      - TG_TOKENIZER_PATH=/models/model
      - TG_REQUIRE_EXACT_TOKENIZER=${REQUIRE_EXACT_TOKENIZER:-true}
      - TG_MODEL_RELEASE_ID=${MODEL_RELEASE_ID:-tg-12b-merged}
      - TG_MAX_CONCURRENT_REQUESTS=${MAX_CONCURRENT_REQUESTS:-64}
      - TG_MAX_BULK_CONCURRENT_REQUESTS=${MAX_BULK_CONCURRENT_REQUESTS:-16}
      - TG_MAX_QUEUE_DEPTH=${MAX_QUEUE_DEPTH:-128}
      - TG_HOST=0.0.0.0
      - TG_PORT=8080
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request, sys; r = urllib.request.urlopen('http://localhost:8080/ready'); sys.exit(0 if r.status == 200 else 1)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - serving_net

networks:
  serving_net:
    driver: bridge
