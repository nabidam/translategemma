[project]
name = "translategemma-project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch==2.13.0",
    "torchvision",
    "torchaudio",
    "transformers",
    "peft",
    "trl",
    "datasets",
    "accelerate",
    "bitsandbytes",
    "pandas",
    "pyyaml",
    "pysbd",
    "unbabel-comet>=2.2.0",
    "rich>=15.0.0",
    "datasketch>=2.0.0",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
