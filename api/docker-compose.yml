# Default deployment: the gateway alone, pointed at a vLLM that is already
# running somewhere else (another host, another compose project, a shared
# inference cluster). Nothing here reserves a GPU.
#
# The full single-host stack -- vLLM and the gateway together -- lives in
# docker-compose.full.yml:
#
#   docker compose -f docker-compose.full.yml up -d
#
# TG_VLLM_BASE_URL is the one variable this file cannot default usefully: there
# is no service name to resolve, so it must name a reachable vLLM. Set it in
# api/.env. `${VAR:?message}` makes compose refuse to start rather than boot a
# gateway that 503s on every request.
x-tg-environment: &tg-environment
  # Remote vLLM. Include the /v1 suffix; the gateway posts to
  # <base>/completions. TG_VLLM_MODEL must match that server's
  # --served-model-name, not a local path.
  TG_VLLM_BASE_URL: ${TG_VLLM_BASE_URL:?set TG_VLLM_BASE_URL to the remote vLLM, e.g. http://10.0.0.5:8000/v1}
  TG_VLLM_MODEL: ${TG_VLLM_MODEL:-model}
  # Sent as `Authorization: Bearer`. Empty means the upstream is unauthenticated
  # (fine on a private network, not over the public internet).
  TG_VLLM_API_KEY: ${TG_VLLM_API_KEY:-}
  # A remote hop is slower and fails differently than a container-network one:
  # the timeout covers the whole generation, and retries only cover transport
  # errors, not a model that is genuinely slow.
  TG_VLLM_TIMEOUT: ${TG_VLLM_TIMEOUT:-300}
  TG_VLLM_MAX_RETRIES: ${TG_VLLM_MAX_RETRIES:-2}
  # The gateway's own ceiling on in-flight upstream requests. Keep it under what
  # the remote server is sized for -- it is shared with whoever else uses it.
  TG_MAX_CONCURRENT_REQUESTS: ${TG_MAX_CONCURRENT_REQUESTS:-32}

  # What is served. The gateway reads this checkpoint's tokenizer and chat
  # template (no weights) to render prompts, so it must be the same checkpoint
  # the remote vLLM serves -- otherwise the token ids posted upstream do not
  # mean what the server thinks they mean.
  #
  # Two ways to satisfy it:
  #   * a path under the ${MODELS_DIR} mount below (default), or
  #   * a Hub id such as google/translategemma-12b-it, which needs
  #     HF_HUB_OFFLINE=0 and a token on the first start.
  TG_BASE_MODEL_ID: ${TG_BASE_MODEL_ID:-/models/translategemma-12b-merged}
  # Which system those weights are, which selects the prompt rendering. One
  # vLLM holds one set of weights, so this is a statement of fact about the
  # upstream, not a per-request choice.
  TG_SERVED_SYSTEM: ${TG_SERVED_SYSTEM:-adapter}

  # Translation Defaults
  TG_SOURCE_LANG: ${TG_SOURCE_LANG:-en}
  TG_TARGET_LANG: ${TG_TARGET_LANG:-fa}
  TG_MAX_NEW_TOKENS: ${TG_MAX_NEW_TOKENS:-512}
  TG_DO_SAMPLE: ${TG_DO_SAMPLE:-false}
  TG_TEMPERATURE: ${TG_TEMPERATURE:-1.0}
  TG_TOP_P: ${TG_TOP_P:-1.0}

  # Batching & Performance Settings. TG_BATCH_SIZE is prompts per upstream
  # request; vLLM does the GPU batching itself.
  TG_BATCH_SIZE: ${TG_BATCH_SIZE:-8}
  TG_MAX_BATCH_ITEMS: ${TG_MAX_BATCH_ITEMS:-128}
  TG_SPLIT_SENTENCES: ${TG_SPLIT_SENTENCES:-false}

  # CORS Settings
  TG_CORS_ORIGINS: ${TG_CORS_ORIGINS:-*}
  TG_CORS_ALLOW_CREDENTIALS: ${TG_CORS_ALLOW_CREDENTIALS:-true}
  TG_CORS_ALLOW_METHODS: ${TG_CORS_ALLOW_METHODS:-*}
  TG_CORS_ALLOW_HEADERS: ${TG_CORS_ALLOW_HEADERS:-*}

  # Offline Cache Settings. Set HF_HUB_OFFLINE=0 (and HUGGING_FACE_HUB_TOKEN)
  # when TG_BASE_MODEL_ID is a Hub id rather than a mounted path.
  HF_HOME: ${HF_HOME:-/models}
  HUGGINGFACE_HUB_CACHE: ${HUGGINGFACE_HUB_CACHE:-/models/hub}
  HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
  TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
  HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}

  # Glossary (optional; off by default). Absent from a running container's
  # environment does not disable the feature by itself -- TG_GLOSSARY_ENABLED
  # is the kill switch, and these defaults exist only so setting that one
  # variable in api/.env is enough to turn the feature on without editing this
  # file. See api/.env.example for what each one means.
  TG_GLOSSARY_ENABLED: ${TG_GLOSSARY_ENABLED:-false}
  TG_ADMIN_API_KEY: ${TG_ADMIN_API_KEY:-}
  # Four-slash form: sqlite+aiosqlite:// + an absolute /data path, matching
  # the glossary-data volume mounted below.
  TG_GLOSSARY_DB_URL: ${TG_GLOSSARY_DB_URL:-sqlite+aiosqlite:////data/glossary.db}
  TG_GLOSSARY_DEFAULT_DOMAIN: ${TG_GLOSSARY_DEFAULT_DOMAIN:-}
  TG_GLOSSARY_UNKNOWN_DOMAIN: ${TG_GLOSSARY_UNKNOWN_DOMAIN:-reject}
  TG_TERMINOLOGY_MODE: ${TG_TERMINOLOGY_MODE:-enforce}

services:
  translategemma-api:
    image: ${IMAGE_NAME:-translategemma-api}
    build:
      context: ${BUILD_CONTEXT:-.}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8000}:${CONTAINER_PORT:-8000}"
    volumes:
      # Read for the tokenizer and chat template only. No weights are loaded in
      # this container, so no GPU is reserved for it. Drop this mount when
      # TG_BASE_MODEL_ID is a Hub id.
      - ${MODELS_DIR:-./offline_assets/models}:/models:ro
      # Termbase database. Outside the container filesystem so it survives a
      # rebuild; harmless when TG_GLOSSARY_ENABLED is false, since nothing
      # opens it.
      - glossary-data:/data
    environment: *tg-environment
    # extra_hosts lets TG_VLLM_BASE_URL name the docker host itself
    # (http://host.docker.internal:8001/v1) when vLLM runs outside compose but
    # on this machine. Harmless otherwise.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Runs a real translation through the remote vLLM, so it proves the whole
      # path -- including that the upstream is reachable and serving the model
      # this gateway renders for. There is no depends_on to gate start-up here,
      # so a remote that is still loading shows up as an unhealthy gateway
      # until it answers.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if b'OK' in urllib.request.urlopen('http://localhost:8000/health-check').read() else 1)"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 120s

  # Speed benchmark. Same image, same settings, no ports, never started by
  # `docker compose up` (it is behind a profile).
  #
  #   docker compose run --rm benchmark --api-url http://translategemma-api:8000
  #
  # Arguments after the service name go straight to the script (--help lists
  # them). Reports land in ./benchmarks on the host. The gateway must be up:
  # the benchmark loads no weights of its own. Numbers measure the remote vLLM
  # plus the network hop to it, which is the deployment as callers see it.
  benchmark:
    profiles: ["benchmark"]
    image: ${IMAGE_NAME:-translategemma-api}
    build:
      context: ${BUILD_CONTEXT:-.}
    entrypoint: ["python", "scripts/benchmark_speed.py"]
    volumes:
      - ${MODELS_DIR:-./offline_assets/models}:/models:ro
      - ${BENCHMARK_OUTPUT_DIR:-./benchmarks}:/app/benchmarks
    environment:
      <<: *tg-environment
      TG_BENCHMARK_API_URL: ${TG_BENCHMARK_API_URL:-http://translategemma-api:8000}
      TG_BENCHMARK_OUTPUT_DIR: /app/benchmarks

volumes:
  glossary-data:
