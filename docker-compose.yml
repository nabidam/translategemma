# Interactive, fully offline TranslateGemma environment.
#
# Usage on the offline host:
#   docker compose run --rm trainer            # interactive shell in /workspace
#   docker compose run --rm trainer python train.py --config config.yaml --dry-run
#   docker compose build quantizer && docker compose run --rm quantizer \
#       /models/merged /models/merged-fp8
#
# `run` is preferred over `up` because these are foreground jobs, not services.

services:
  trainer:
    image: ${IMAGE_NAME:-translategemma}:${IMAGE_TAG:-cu128-py312}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_METRICX: ${INSTALL_METRICX:-1}
        # cu128 is the r570+ default. The retained CUDA 13.0 image is built
        # explicitly with IMAGE_TAG=cu130-py312 PYTORCH_CUDA=cu130.
        PYTORCH_CUDA: ${PYTORCH_CUDA:-cu128}
        # Off by default. Setting it to 1 installs the prebuilt FlashAttention 3
        # wheel from wheels/ and MUST be paired with its own tag, since the
        # result only runs on Hopper (sm_90):
        #   IMAGE_TAG=cu128-fa3-py312 INSTALL_FLASH_ATTN3=1 docker compose build trainer
        INSTALL_FLASH_ATTN3: ${INSTALL_FLASH_ATTN3:-0}

    # Run as the invoking host user so adapters, logs, benchmark HTML, and
    # evaluation CSVs written into the bind mounts are not owned by root.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    working_dir: /workspace
    stdin_open: true
    tty: true

    # NCCL/dataloader shared memory. `ipc: host` avoids the default 64 MB /dev/shm
    # that makes dataloader_num_workers > 0 crash with bus errors.
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864

    volumes:
      # Source, config, data and outputs: editable on the host, no rebuild needed.
      - .:/workspace
      # Staged model tree, produced by scripts/fetch_offline_assets.py --dest.
      # Deliberately NOT read-only: huggingface_hub takes file locks under
      # <cache>/.locks even on cache hits, and COMET's download_model() goes
      # through snapshot_download() at every run.
      - ${MODELS_DIR:-./offline_assets/models}:/models
      # Scratch cache (XDG_CACHE_HOME / HOME) for anything that writes outside
      # the HF tree, kept off the model mount so it can be wiped freely.
      - ${HF_CACHE_DIR:-./offline_assets/hf_cache}:/hf_cache

    environment:
      # Hard offline. Any accidental network fetch fails loudly instead of hanging.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      # MODELS_DIR is mounted at /models and IS the HF home, so the hub cache is
      # /models/hub — exactly where fetch_offline_assets.py --dest writes. This
      # also covers unbabel-comet's download_model(), which calls
      # snapshot_download(cache_dir=None) and therefore uses the default cache.
      HF_HOME: /models
      HUGGINGFACE_HUB_CACHE: /models/hub
      # Kept OFF the model mount on purpose. Tokenizing a multi-million-row
      # corpus with training.tokenize_num_proc writes one Arrow shard per
      # worker; under the HF_HOME default those land inside the staged model
      # tree, which is the one directory that ships between machines.
      HF_DATASETS_CACHE: /hf_cache/datasets
      # The container runs as a numeric uid with no /etc/passwd entry, so HOME
      # would otherwise default to / and libraries would scatter ~/.cache there.
      HOME: /hf_cache
      XDG_CACHE_HOME: /hf_cache
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      # Which GPUs the container sees: "all", or "0", or "0,1".
      NVIDIA_VISIBLE_DEVICES: ${GPUS:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Hopper (sm_90), Blackwell (sm_120) and Ada (sm_89) all benefit from the
      # expandable allocator on long runs with variable sequence lengths.
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # FP8 quantisation of a merged checkpoint, for serving two models on one GPU.
  #
  # Its own image, and necessarily so: no llm-compressor release installs
  # alongside the trainer's torch 2.8 / transformers 4.57 lock. See the version
  # table in scripts/quantize.Dockerfile.
  #
  #   docker compose build quantizer      # once, with network access
  #   docker compose run --rm quantizer \
  #     /models/translategemma-12b-merged /models/translategemma-12b-merged-fp8
  #
  # Arguments after the service name go straight to scripts/quantize_fp8.py
  # (--help lists them). Defaults to --device cpu, so it does not compete with
  # anything serving on the GPU; pass --device cuda:0 when the card is free.
  quantizer:
    profiles: ["tools"]
    image: ${QUANTIZER_IMAGE_NAME:-translategemma-quantizer}:${QUANTIZER_IMAGE_TAG:-vllm0.13.0}
    build:
      context: .
      dockerfile: scripts/quantize.Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    ipc: host
    volumes:
      - .:/workspace
      # Not read-only: the quantised checkpoint is written next to the merge.
      - ${MODELS_DIR:-./offline_assets/models}:/models
      - ${HF_CACHE_DIR:-./offline_assets/hf_cache}:/hf_cache
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HOME: /models
      HUGGINGFACE_HUB_CACHE: /models/hub
      HOME: /hf_cache
      XDG_CACHE_HOME: /hf_cache
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      NVIDIA_VISIBLE_DEVICES: ${GPUS:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
